# read-it-fast for tmux — source this from ~/.tmux.conf:
#   source-file ~/projects/read-it-fast/read-it-fast.tmux.conf

# 1) Mouse-select text, then press R while the selection is still active
#    (works in any pane: claude code, nvim, bat, man, ...)
bind -T copy-mode-vi R send -X copy-pipe-and-cancel "rif-tmux"
bind -T copy-mode    R send -X copy-pipe-and-cancel "rif-tmux"

# 2) prefix + R — speed-read the last thing you copied.
#    With default tmux mouse settings, releasing a mouse drag already copies
#    the selection into the tmux buffer, so: drag, then prefix+R.
bind R run-shell "tmux save-buffer - | rif-tmux"

# 3) prefix + P — speed-read everything visible in the current pane
#    (e.g. the answer claude code just printed).
bind P run-shell "tmux capture-pane -pJ | rif-tmux"
